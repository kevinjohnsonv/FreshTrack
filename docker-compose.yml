services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: freshtrack
      POSTGRES_PASSWORD: freshtrack
      POSTGRES_DB: freshtrack
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freshtrack"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ingestion-service:
    build: ./ingestion-service
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://freshtrack:freshtrack@postgres:5432/freshtrack
      REDIS_URL: redis://redis:6379

volumes:
  pgdata:
